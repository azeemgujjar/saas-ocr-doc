version: "3.9"

# IDP SaaS stack: postgres, redis, ocr, api, worker, frontend.
# api and worker build from the same image — only the command differs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: idp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idp_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-idp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: idp_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: idp_api
    restart: unless-stopped
    # sync schema, seed, then start the API
    command: ["sh", "-c", "npx prisma db push --skip-generate --accept-data-loss && node dist/prisma/seed.js && node dist/src/main.js"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp_dev_password}@postgres:5432/${POSTGRES_DB:-idp}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    container_name: idp_ocr
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: idp_worker
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-idp}:${POSTGRES_PASSWORD:-idp_dev_password}@postgres:5432/${POSTGRES_DB:-idp}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OCR_SERVICE_URL: http://ocr:4000
      APP_ROLE: worker
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ocr:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: idp_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads_data:
